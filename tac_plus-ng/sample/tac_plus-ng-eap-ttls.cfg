#!/usr/bin/env -S /usr/local/bin/tactrace.pl --user inner-user --conf

# RADIUS EAP-TTLSv0 termination with inner PAP.
#
# tac_plus-ng terminates EAP-TTLS itself; it does not proxy EAP to an external
# server. This sample uses EAP-TTLSv0 with PAP as the only supported inner
# method.
#
# The server certificate/key are the demo CA files generated by sample/democa:
#
#     make -C tac_plus-ng/sample/democa
#
# verify-client = no is the normal TTLS/PAP setup: the inner PAP exchange
# authenticates the user and no client certificate is checked, so ca-file is
# not needed. With verify-client = yes, ca-file is required and the peer must
# present a certificate that chains to it; inner PAP is still required.
#
# Outer identity: the EAP-Response/Identity is typically "anonymous" (or
# "anonymous@realm"). It is unauthenticated and is ignored for authorization.
# The inner User-Name AVP is authoritative and must name a configured user.
#
# Inner PAP: User-Password is cleartext inside the TLS tunnel. RFC 2865 allows
# NUL padding to a multiple of 16 octets; trailing NULs are stripped. Empty
# names/passwords, embedded NULs, names over 255 bytes and passwords over 128
# bytes are rejected. Passwords are never logged and the buffer is cleansed
# after use.
#
# MFA: if the selected user or host requires MFA, EAP authentication is
# rejected with EAP-Failure. MFA cannot be challenged inside EAP-TTLS.
#
# MAVIS: inner PAP uses the local password path only. A user whose login
# credential is MAVIS (password login = mavis) is rejected; MAVIS cannot be
# challenged inside the TLS tunnel in this phase.
#
# TLS profile: TLS 1.2 only. RFC 5281 permits TLS 1.0/1.1, but those are
# deprecated by RFC 8996; TLS 1.3 is not negotiated. Compression, session
# resumption, session tickets, renegotiation, and EAP fast reconnect are
# disabled.
#
# Security note: TTLSv0 has no cryptographic binding between the TLS tunnel
# and the outer EAP conversation (RFC 5281 5.2 and 5.3; TTLSv1 adds channel
# binding). A man-in-the-middle can relay the inner PAP exchange through its
# own tunnel ("TLS tunneling" attack) and observe or relay the credentials.
# Deploy TTLSv0 only where the layer-2 path to the authenticator is trusted,
# or terminate EAP on infrastructure you control. verify-client = yes
# authenticates the peer but does not add the missing outer binding.
#
# UDP: EAP state is local to the worker handling the flow. spawnd hands each
# NAS source flow to one worker through a connected DGRAM socket, so
# multi-worker UDP EAP works without "single process = yes", "sticky cache
# period", or a broker. State is per worker; if that worker dies or is
# retired, the NAS must restart the conversation. RADIUS/TCP and RADIUS/TLS
# have connection affinity for the same reason. "single process = yes" is a
# test-only mode.
#
# There is no broker-socket keyword in this phase; it arrives with a later UDP
# EAP broker.
#
# To disable EAP inherited from the default realm in a child realm:
#
#     realm lab {
#         eap = no
#     }

id = spawnd {
	background = no
	# EAP over RADIUS/TLS (RadSec) pins the conversation to one worker.
	# Uncomment this together with the tls credentials below.
	# listen { port = 2083 tls = yes }
	# RADIUS over UDP: the connected per-flow socket keeps an EAP
	# conversation on one worker; no single process or broker is needed.
	listen { port = 1812 protocol = UDP }
	listen { port = 1813 protocol = UDP flag = accounting }
}

id = tac_plus-ng {
	include = $CONFDIR/radius-dict.cfg

	eap {
		eap-method = ttls
		eap-inner-method = pap
		cert-file = $CONFDIR/democa/server-chain.pem
		key-file = $CONFDIR/democa/server.key
		# ca-file is only needed (and required) with verify-client = yes.
		# ca-file = $CONFDIR/democa/root.crt
		verify-client = no
		eap-identity-source = inner-identity
		timeout = 60
		max-message = 65535
		max-sessions = 4096
	}

	# TLS server credentials for a RadSec listener (see the commented listen
	# line above). EAP-TTLS uses the dedicated eap block; do not share an
	# EAP server key with HTTPS or other services.
	tls cert-file = $CONFDIR/democa/server-chain.pem
	tls key-file = $CONFDIR/democa/server.key
	tls ca-file = $CONFDIR/democa/root.crt

	device world {
		address = ::/0
		radius.key = demo
	}

	profile eap-profile {
		script {
			if (aaa.protocol == radius) {
				set radius[Cisco:Cisco-AVPair] = "shell:priv-lvl=15"
				permit
			}
		}
	}

	# The inner User-Name AVP selects this user; the outer identity is ignored.
	user inner-user {
		password pap = clear papsecret
		profile = eap-profile
	}
}
